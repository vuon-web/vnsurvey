baseURL: "https://vuon-web.github.io/vnsurvey/"

locale:
  language: vi-VN

defaultContentLanguage: vi

title: "VườnWeb Engineering"

enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "Your Engineering Blog"
  description: "Personal engineering blog about backend, infrastructure, distributed systems and software architecture."
  author: "Your Name"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true
  comments: true
  images:
    - "/images/og-default.png"

  homeInfoParams:
    Title: "Hi 👋"
    Content: >-
      Software Engineer writing about Backend Engineering, Infrastructure,
      Distributed Systems, Rust, Kubernetes, Terraform and things I learn.

  socialIcons:
    - name: github
      url: "https://github.com/vuon-web"
    - name: linkedin
      url: "https://www.linkedin.com/in/quydmfl/"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50

taxonomies:
  category: categories
  tag: tags

googleAnalytics: ""

privacy:
  googleAnalytics:
    disable: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: true
    lineNumbersInTable: true
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    style: github

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml
